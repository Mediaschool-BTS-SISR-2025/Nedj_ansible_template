---
# === Installation et configuration de WireGuard (serveur Debian) ===

# Variables par défaut
# wireguard_port: 51820
# wireguard_network: 10.8.0.0/24
# wireguard_interface: wg0

- name: Mise à jour de la liste des paquets
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Installation de WireGuard et des outils nécessaires
  apt:
    name:
      - wireguard
      - wireguard-tools
      - qrencode
    state: present

- name: Définir les variables par défaut si non spécifiées
  set_fact:
    wireguard_port: "{{ wireguard_port | default(51820) }}"
    wireguard_network: "{{ wireguard_network | default('10.8.0.0/24') }}"
    wireguard_interface: "{{ wireguard_interface | default('wg0') }}"
    wireguard_server_ip: "{{ wireguard_server_ip | default('10.8.0.1') }}"

# Génération des clés du serveur si absentes
- name: Générer la clé privée du serveur WireGuard
  command: "wg genkey"
  register: wg_private_key
  when: not (wg_private_key is defined)
  changed_when: true

- name: Enregistrer la clé privée sur le disque
  copy:
    dest: /etc/wireguard/server_private.key
    content: "{{ wg_private_key.stdout }}"
    owner: root
    group: root
    mode: '0600'
  when: wg_private_key is defined

- name: Générer la clé publique à partir de la clé privée
  command: "echo '{{ wg_private_key.stdout }}' | wg pubkey"
  register: wg_public_key
  when: wg_private_key is defined
  changed_when: true

- name: Enregistrer la clé publique sur le disque
  copy:
    dest: /etc/wireguard/server_public.key
    content: "{{ wg_public_key.stdout }}"
    owner: root
    group: root
    mode: '0644'
  when: wg_public_key is defined

# Création du fichier de configuration principal
- name: Créer la configuration WireGuard du serveur
  copy:
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    content: |
      [Interface]
      Address = {{ wireguard_server_ip }}/24
      ListenPort = {{ wireguard_port }}
      PrivateKey = {{ wg_private_key.stdout }}

      # Exemple de client (à personnaliser)
      # [Peer]
      # PublicKey = <clé_publique_client>
      # AllowedIPs = 10.8.0.2/32

    owner: nedj
    group: nedj
    mode: '600'
  notify: Redémarrer WireGuard


# Activer le routage IPv4 (nécessaire pour VPN)
- name: Activer le routage IPv4
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

# Ouvrir le port UDP dans UFW (si actif)
- name: Ouvrir le port WireGuard UDP dans le pare-feu
  command: "ufw allow {{ wireguard_port }}/udp"
  ignore_errors: yes

# Activer et démarrer le service
- name: Activer et démarrer WireGuard
  systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    state: started
    enabled: yes
    daemon_reload: yes

# Vérifier l'état de WireGuard
- name: Vérifier l'état de WireGuard
  shell: "wg show || true"
  register: wg_status
  changed_when: false

- debug:
    msg: "{{ wg_status.stdout_lines }}"

