---
# Déploiement de WireGuard via wg-easy (Docker Compose)

- name: Créer le répertoire du projet wg-easy
  file:
    path: "{{ wg_easy_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Déployer le fichier docker-compose.yml de wg-easy
  template:
    src: docker-compose.yml.j2
    dest: "{{ wg_easy_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

