          options:
            loki-url: http://loki:3100/loki/api/v1/push

    alertmanager:
        image: prom/alertmanager:latest
        container_name: alertmanager
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.80  
          proxy:
        ports:
          - "9093:9093"  
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - ./alertmanager_data:/alertmanager
          - ./alertmanager_data/alertmanager.yml:/etc/alertmanager/alertmanager.yml
        # labels:
        #   - "traefik.enable=true"
        #   - "traefik.docker.network=proxy"
        #   - "traefik.http.routers.alertmanager-secure.entrypoints=websecure"
        #   - "traefik.http.routers.alertmanager-secure.rule=Host(`${SERVER_NAME}-alertmanager.${DOMAIN_NAME}`)"
