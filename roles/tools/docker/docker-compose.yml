    openldap:
        image: cleanstart/openldap:latest
        container_name: openldap
        environment:
          LDAP_ORGANISATION: "Mediaschool"
          LDAP_DOMAIN: mediaschool.local
          LDAP_ADMIN_PASSWORD: "123456789"
        ports:
          - "389:389"
          - "636:636"
        volumes:
          - ./openldap/config:/etc/ldap/slapd.d
          - ./openldap/data:/var/lib/ldap
        restart: unless-stopped
        security_opt:
          - no-new-privileges:true
        read_only: true
        user: "1000:1000"

    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer
        hostname: portainer 
        networks:
          - proxy
        ports:
          - "9000:9000" 
        restart: always
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - ./portainer_data:/data
        # labels:
        #   - "traefik.enable=true"
        #   - "traefik.docker.network=proxy"
        #   - "traefik.http.routers.portainer-secure.entrypoints=websecure"
        #   - "traefik.http.routers.portainer-secure.rule=Host(`${SERVER_NAME}-portainer.${DOMAIN_NAME}`)"
        #   - "traefik.http.routers.portainer-secure.service=portainer"
        #   - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push

    loki:
        image: grafana/loki:latest
        container_name: loki
        hostname: loki
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.90  
          proxy:
        ports:
          - "3100:3100"
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - ./loki_data:/loki
        # labels:
        #   - "traefik.enable=true"
        #   - "traefik.docker.network=proxy"
        #   - "traefik.http.routers.loki-secure.entrypoints=websecure"
        #   - "traefik.http.routers.loki-secure.rule=Host(`${SERVER_NAME}-loki.${DOMAIN_NAME}`)"
        #   - "traefik.http.routers.loki-secure.service=loki"
        #   - "traefik.http.services.loki.loadbalancer.server.port=3100"
        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push

    promtail:
        image: grafana/promtail:latest
        container_name: promtail
        hostname: promtail
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.60  
          proxy:
        ports:
          - "3101:3101"  
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - ./promtail_data:/promtail
          - /var/log:/var/log:ro
        # labels:
        #   - "traefik.enable=true"
        #   - "traefik.docker.network=proxy"
        #   - "traefik.http.routers.promtail-secure.entrypoints=websecure"
        #   - "traefik.http.routers.promtail-secure.rule=Host(`${SERVER_NAME}-promtail.${DOMAIN_NAME}`)"
        #   - "traefik.http.routers.promtail-secure.service=promtail"
        #   - "traefik.http.services.promtail.loadbalancer.server.port=3101"
        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.40  
          proxy:
        ports:
          - "3000:3000"  
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - grafana-storage:/var/lib/grafana
          - grafana-conf:/usr/share/grafana
        # labels:
        #   - "traefik.enable=true"
        #   - "traefik.docker.network=proxy"
        #   - "traefik.http.routers.grafana-secure.entrypoints=websecure"
        #   - "traefik.http.routers.grafana-secure.rule=Host(`${SERVER_NAME}-grafana.${DOMAIN_NAME}`)"
        #   - "traefik.http.routers.grafana-secure.service=grafana"
        #   - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.30  
          proxy:
        ports:
          - "9095:9090"  
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - ./prometheus_data:/etc/prometheus/
        # labels:
        #   - "traefik.enable=true"
        #   - "traefik.docker.network=proxy"
