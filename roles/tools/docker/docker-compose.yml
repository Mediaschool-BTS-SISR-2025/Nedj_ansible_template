        #   - "traefik.http.routers.blackbox-exporter-secure.rule=Host(`${SERVER_NAME}-blackbox-exporter.${DOMAIN_NAME}`)"
        #   - "traefik.http.routers.blackbox-exporter-secure.service=blackbox-exporter"
        #   - "traefik.http.services.blackbox-exporter.loadbalancer.server.port=9115"
        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push
        
    phpldapadmin:
        image: osixia/phpldapadmin:latest
        container_name: phpldapadmin
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.50
          proxy:
        ports:
          - "8080:80"
        environment:
          - PHPLDAPADMIN_LDAP_HOSTS=ldap://10.0.2.15:389
          - PHPLDAPADMIN_HTTPS=false
        extra_hosts:
          - "host.docker.internal:host-gateway"
        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push

volumes:
  grafana-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./grafana-storage
  grafana-conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./grafana-data

networks:
    metric:
      ipam:
        driver: default
        config:
          - subnet: "10.14.7.0/24"
    proxy:
      ipam:
        driver: default