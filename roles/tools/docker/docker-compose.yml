        logging:
          driver: loki
          options:
            loki-url: http://loki:3100/loki/api/v1/push

    blackbox-exporter:
        image: prom/blackbox-exporter:latest
        container_name: blackbox-exporter
        restart: always
        networks:
          metric:
            ipv4_address: 10.14.7.70  
          proxy:
        ports:
          - "9115:9115"  
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - ./blackbox-exporter_data:/blackbox-exporter
          - ./blackbox-exporter_data/blackbox.yml:/etc/blackbox-exporter/config.yml
