alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 10.14.7.70:9093
    scheme: http
    timeout: 10s
scrape_configs:
  - job_name: 'traefik'
    # If the traefik has authentication
    basic_auth:
        username: admin@shenron.dev
        password: d3ojImvaiOJ0vgrqeAycu8DUbI3A1oXqUa0eMl2syFt4tPJJb4lQz41wkabQom4E
    # If the entrypoint is HTTPS
    scheme: https
    static_configs:
      - targets:
        - traefik.shenron.dev:443

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
    - targets: ['10.14.7.10:8080']

  - job_name: node-exporter
    scrape_interval: 5s
    static_configs:
    - targets: ['10.14.7.20:9100']

