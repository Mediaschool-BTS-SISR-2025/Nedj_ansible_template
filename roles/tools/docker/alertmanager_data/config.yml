config:
  global:
    resolve_timeout: 5m
  route:
    group_by: ['job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    receiver: 'email-shenron'
    routes:
    - match:
        alertname: Watchdog
      receiver: 'null'

  receivers:
  - name: email-shenron
    email_configs:
    - to: $GMAIL_LOGIN
      from: $GMAIL_LOGIN
      smarthost: smtp.gmail.com:587
      auth_username: "$GMAIL_LOGIN"
      auth_password: "$GMAIL_PASS"
      require_tls: true
      send_resolved: true