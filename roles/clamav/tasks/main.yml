---
# Rôle : déployer ClamAV via Docker Compose dans /home/iris/sisr/securite

- name: S'assurer que le répertoire /home/iris/sisr/securite existe
  ansible.builtin.file:
    path: /home/iris/sisr/securite
    state: directory
    owner: iris
    group: iris
    mode: '0755'

- name: Déployer le fichier docker-compose.yml pour ClamAV
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/iris/sisr/securite/docker-compose.yml
    owner: iris
    group: iris
    mode: '0644'

- name: Lancer / mettre à jour le stack ClamAV avec Docker Compose
  become: yes
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /home/iris/sisr/securite
  register: clamav_docker_compose
  changed_when: >
    'Creating'   in clamav_docker_compose.stdout or
    'Recreating' in clamav_docker_compose.stdout or
    'Starting'   in clamav_docker_compose.stdout
